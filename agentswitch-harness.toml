# Hosted harness run ("Our harness" -> Submit for a run).
# The agent is stdlib-only; install fetches certifi for its CA bundle.
# run needs no shell (no cd) and works from the repo root; it always
# writes <repo>/results.json.
# Write mode: the hosted instance is a throwaway copy, and without --write
# every requires_write task (the lifecycle ones) is left out of the run.
# Keep --budget-minutes a few minutes under timeout_minutes.
install = "pip install -r requirements.txt"
run     = "python agent/run_hosted.py --write --budget-minutes 20 --task-timeout 180"
results = "results.json"
instances = ["suryodaya", "keystone"]
timeout_minutes = 25
