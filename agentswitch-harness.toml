# Hosted harness run ("Our harness" -> Submit for a run).
# The agent is stdlib-only; install fetches certifi for its CA bundle.
# run needs no shell (no cd) and works from the repo root; it always
# writes <repo>/results.json.
# Write mode: the hosted instance is a throwaway copy, and without --write
# every requires_write task (the lifecycle ones) is left out of the run.
# While standard_rate is redacted, the two priced-item write tasks are
# left out as well: their fixture cannot be built, so scoring them only
# adds failures. The other write tasks still run.
# timeout_minutes is one clock for install and both instances back to back.
# The first instance writes its start time to hosted_clock.json; the second
# stops at start + --total-minutes (keep that a few minutes under
# timeout_minutes). --budget-minutes caps each instance on its own.
# Tasks marked hosted_repeat_of in tasks.json are left out of this run.
install = "pip install -r requirements.txt"
run     = "python agent/run_hosted.py --write --budget-minutes 13.5 --total-minutes 27 --task-timeout 180"
results = "results.json"
instances = ["suryodaya", "keystone"]
timeout_minutes = 30
